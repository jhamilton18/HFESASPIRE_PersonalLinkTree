<title>ADAPT Lab Links</title>
<meta name="description" content="Scan-to-connect page: ADAPT Lab website and team LinkedIn profiles.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f1a18;
    --muted: #716661;
    --line: #e9d9c6;
    --card: #fbf4ea;          /* warm cream fill for person cards */
    --maroon: #8b1e1e;        /* ADAPT Lab maroon */
    --gold: #d1a83a;          /* ADAPT Lab gold */
    --linkedin: #0a66c2;
    --white: #ffffff;
    --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }

  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--body); font-size: 17px; line-height: 1.45;
    padding-inline: 16px; padding-block: 36px 56px;
  }
  main { max-width: 420px; margin: 0 auto; display: grid; gap: 32px; }

  header { display: grid; justify-items: center; text-align: center; gap: 12px; }
  .logo-wrap { width: 100%; }
  .logo { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }

  .group-title {
    font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; font-weight: 700;
  }

  .links, .people { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; }

  /* Lab card */
  .link {
    display: flex; align-items: center; gap: 14px;
    background: var(--maroon); color: var(--white);
    border-radius: 12px; padding: 14px 16px; text-decoration: none;
  }
  .link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .badge { flex: 0 0 auto; display: grid; place-items: center; color: var(--white); }
  .badge svg { width: 26px; height: 26px; fill: currentColor; }
  .text { min-width: 0; display: grid; gap: 2px; }
  .label { font-weight: 600; }
  .sub { font-size: .9rem; opacity: .85; overflow-wrap: anywhere; }
  .chev { margin-left: auto; flex: 0 0 auto; opacity: .8; }
  .chev svg { width: 18px; height: 18px; fill: currentColor; }

  /* Person cards */
  .person {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; display: grid; gap: 12px;
  }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    flex: 1 1 120px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: .95rem;
    text-decoration: none; color: var(--white); background: var(--linkedin);
    border: 1px solid transparent;
  }
  .btn svg { width: 19px; height: 19px; fill: currentColor; flex: 0 0 auto; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.site { background: var(--maroon); }
  .btn.soon { background: var(--white); color: var(--muted); border-color: var(--line); cursor: default; }
  .btn.soon span::after { content: " soon"; font-weight: 400; }
  .link.soon { opacity: .55; cursor: default; }

</style>
